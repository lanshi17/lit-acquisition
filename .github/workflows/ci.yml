name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync ruff check src tests

  test-lite:
    # Lite edition contract: base dependencies only, openai absent.
    # The full suite must pass with LLM-backed stages degrading gracefully.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Assert openai is absent (true lite environment)
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('openai') is None, 'openai leaked into lite env'"
      - name: Install test runner (does not pull openai)
        run: uv pip install pytest pytest-asyncio
      - run: uv run --no-sync pytest -q

  rust-service:
    # The axum entry point lives outside the Python package but must keep
    # building; these tests cover config parsing, validation and HTTP wiring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked --manifest-path server/Cargo.toml

  docker-image:
    # The image is the deployment artifact: build it and prove the container
    # actually serves /healthz and /readyz (worker import included).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lit-acquisition:ci
          # `load: true` needs a plain single-platform image, not a manifest list.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 18080:8080 lit-acquisition:ci
          ok=0
          for _ in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:18080/healthz > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs smoke; exit 1; fi
          curl -sf -m 120 http://127.0.0.1:18080/readyz
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

  paper-numbers:
    # The Applications Note must never drift from the benchmark artifacts:
    # check_numbers.py recomputes every headline number from
    # benchmarks/results/*.json and asserts it appears in the manuscript.
    # Stdlib only -- no dependency install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python paper/appnote/check_numbers.py

  test-agent:
    # Agent edition: openai installed via the dev extra.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync pytest -q
