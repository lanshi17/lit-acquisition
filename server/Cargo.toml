[package]
name = "lit-acquisition-server"
version = "0.5.1"
edition = "2021"
rust-version = "1.80"
description = "Axum HTTP service entry point for the lit-acquisition toolkit"
license = "MIT"
publish = false

[[bin]]
name = "lit-acquisition-server"
path = "src/main.rs"

[dependencies]
async-channel = "2"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
